[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "LimitOrderBook"
version = "0.1.0"
requires-python = ">=3.11"
description = "A high-performance limit order book with a C++ core exposed through pybind11"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "src/cpp"
wheel.packages = ["src/python/LimitOrderBook"]